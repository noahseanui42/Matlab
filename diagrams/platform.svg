<text x="450" y="500" text-anchor="middle" class="n">Both platforms: equilateral triangle, side 150 mm (blue). Yellow = forearm ball-joint pairs (35 mm rod spacing), dashed = ball-joint axis.</text>
<text x="450" y="530" text-anchor="middle" class="n">Model: platform radius up = SP/√3 = 86.6 mm.  Your part: inradius = 150/(2√3) = 43.3 mm ≈ your ~44 mm.</text>
<text x="450" y="560" text-anchor="middle" class="n">Base is already mid-side style (wb = 50.5 mm, matches). Model offset a = 50.5 − 86.6 = −36 mm, real ≈ 50.5 − 43.3 = +7 mm.</text>
<text x="450" y="595" text-anchor="middle" class="s">Note: arm directions and joint layout are my guess. Please check them against the real plate.</text>
